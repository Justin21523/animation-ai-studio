# SDXL ControlNet training pipeline (zoe_depth) - template
#
# Notes:
# - `zoe_depth` uses the same depth preprocessor config (preprocessing.depth.*) but lets you keep a separate registry key.
#
# Run:
#   python scripts/processing/training/controlnet_training_pipeline.py --config configs/training/controlnet/pipelines/zoe_depth.yaml

images_dir: null
captions_dir: null
control_images_dir: null
default_caption: ""

control_type: "zoe_depth"
detect_resolution: 512
resolution: 1024

dataset_name: "zoe_depth_v1"
controlnet_key: "zoe_depth_v1"
preprocess_as: "zoe_depth"
description: "ZoeDepth ControlNet fine-tune v1"
use_case: "Higher-quality depth conditioning in many cases (ZoeDepth-style depth maps)"

controlnet_config_path: "configs/generation/controlnet_config.yaml"
trainer_config_path: "configs/training/controlnet/trainer.yaml"
registry_path: "configs/generation/controlnet_config.yaml"

