# SDXL ControlNet training pipeline (segmentation) - template
#
# Notes:
# - Default segmentation preprocessor uses `rembg` to produce a binary mask map.
#
# Run:
#   python scripts/processing/training/controlnet_training_pipeline.py --config configs/training/controlnet/pipelines/seg.yaml

images_dir: null
captions_dir: null
control_images_dir: null
default_caption: ""

control_type: "seg"
detect_resolution: 512
resolution: 1024

dataset_name: "seg_v1"
controlnet_key: "seg_v1"
preprocess_as: "seg"
description: "Segmentation ControlNet fine-tune v1"
use_case: "Character/background separation, precise region control"

controlnet_config_path: "configs/generation/controlnet_config.yaml"
trainer_config_path: "configs/training/controlnet/trainer.yaml"
registry_path: "configs/generation/controlnet_config.yaml"

