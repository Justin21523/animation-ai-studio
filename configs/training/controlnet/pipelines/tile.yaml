# SDXL ControlNet training pipeline (tile) - template
#
# Notes:
# - Tile conditioning uses the image itself (resized) as the control map.
#
# Run:
#   python scripts/processing/training/controlnet_training_pipeline.py --config configs/training/controlnet/pipelines/tile.yaml

images_dir: null
captions_dir: null
control_images_dir: null
default_caption: ""

control_type: "tile"
detect_resolution: 512
resolution: 1024

dataset_name: "tile_v1"
controlnet_key: "tile_v1"
preprocess_as: "tile"
description: "Tile ControlNet fine-tune v1"
use_case: "Detail enhancement / tileable texture workflows"

controlnet_config_path: "configs/generation/controlnet_config.yaml"
trainer_config_path: "configs/training/controlnet/trainer.yaml"
registry_path: "configs/generation/controlnet_config.yaml"

