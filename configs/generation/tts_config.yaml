# Unified TTS Configuration (used by ModelManager/Agent/Creative Studio)

tts:
  # Choose ONE main line for production usage:
  # - "xtts": Coqui XTTS-v2 (voice cloning via reference audio)
  # - "auto": try XTTS then fallback to silence
  # - "silence": always generate silent WAV (debug/fallback)
  backend: "xtts"
  language: "en"
  prefer_device: null  # null = auto (cuda if available else cpu)
  cache_dir: "outputs/_cache/tts"

# -----------------------------------------------------------------------------
# GPT-SoVITS TTS Configuration (optional: training/inference wiring)
# NOTE: This repo currently uses XTTS as the main runtime backend. GPT-SoVITS
# settings are kept for future integration and for training workflows.
# -----------------------------------------------------------------------------

gpt_sovits:
  # Repository and models
  repo_path: "/mnt/c/ai_tools/GPT-SoVITS"
  models_dir: "/mnt/c/ai_models/audio/gpt_sovits"

  # Base pretrained models
  base_models:
    gpt: "pretrained/s1bert25hz-2kh-longer-epoch=68e-step=50232.ckpt"
    sovits: "pretrained/s2G488k.pth"

  # Inference settings
  inference:
    device: "cuda"
    dtype: "float16"
    max_length: 1024
    top_k: 15
    top_p: 1.0
    temperature: 1.0
    seed: null  # null for random

  # Audio output settings
  audio:
    sample_rate: 44100
    format: "wav"
    bit_depth: 16
    mono: true

# Voice dataset extraction
dataset:
  whisper_model: "large-v3"  # tiny, base, small, medium, large, large-v3
  diarization_model: "pyannote/speaker-diarization"

  extraction:
    min_duration: 1.0  # seconds
    max_duration: 10.0
    min_snr: 15.0  # Signal-to-noise ratio
    max_samples_per_character: 100

  preprocessing:
    reduce_noise: true
    normalize_volume: true
    remove_silence: true

# Emotion presets (temperature-based)
emotions:
  neutral:
    temperature: 1.0
    speed: 1.0
    description: "Neutral, natural speech"

  happy:
    temperature: 1.2
    speed: 1.05
    description: "Happy, cheerful, upbeat"

  excited:
    temperature: 1.3
    speed: 1.15
    description: "Excited, energetic"

  sad:
    temperature: 0.8
    speed: 0.9
    description: "Sad, melancholic"

  angry:
    temperature: 1.4
    speed: 1.1
    description: "Angry, aggressive"

  calm:
    temperature: 0.9
    speed: 0.95
    description: "Calm, composed"

  scared:
    temperature: 1.1
    speed: 1.08
    description: "Scared, nervous"
