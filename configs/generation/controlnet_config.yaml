# ControlNet Configuration
# Animation AI Studio - Image Generation Module

# ControlNet models (HuggingFace)
# Optional per-model fields:
# - preprocess_as: Force control-image preprocessing type (canny|pose|depth|seg|normal). Useful when the key is a
#   custom model name but you want to reuse existing preprocessing behavior.
controlnet_models:
  pose:
    model_id: "diffusers/controlnet-openpose-sdxl-1.0"
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-openpose-sdxl"
    description: "OpenPose skeleton control"
    use_case: "Character pose control, consistent body positioning"

  canny:
    model_id: "diffusers/controlnet-canny-sdxl-1.0"
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-canny-sdxl"
    description: "Canny edge detection control"
    use_case: "Scene composition, edge-based generation"

  depth:
    model_id: "diffusers/controlnet-depth-sdxl-1.0"
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-depth-sdxl"
    description: "Depth map control"
    use_case: "3D scene depth, spatial relationships"

  zoe_depth:
    model_id: null  # Local model (if you want an HF id, set it here)
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-zoe-depth-sdxl"
    description: "ZoeDepth-based depth control"
    use_case: "Higher quality depth maps than MiDaS in many cases"

  lineart:
    model_id: null
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-lineart-sdxl"
    description: "Lineart control"
    use_case: "Anime/game-style line control, clean silhouettes"

  scribble:
    model_id: null
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-scribble-sdxl"
    description: "Scribble control"
    use_case: "Rough sketch → coherent asset generation"

  softedge:
    model_id: null
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-softedge-sdxl"
    description: "Soft edge control"
    use_case: "Soft contours for composition guidance"

  tile:
    model_id: null
    local_path: "/mnt/c/ai_models/stable-diffusion/controlnet/controlnet-tile-sdxl"
    description: "Tile control"
    use_case: "Detail enhancement / tileable textures"

  seg:
    model_id: "diffusers/controlnet-seg-sdxl-1.0"
    local_path: null  # Optional: provide local model path when available
    description: "Segmentation map control"
    use_case: "Character/background separation, precise region control"

  normal:
    model_id: "diffusers/controlnet-normal-sdxl-1.0"
    local_path: null  # Optional: provide local model path when available
    description: "Normal map control"
    use_case: "Surface detail, lighting consistency"

# Default ControlNet parameters
defaults:
  conditioning_scale: 1.0  # ControlNet influence (0.0-2.0)
  guess_mode: false  # Enable prompt-free generation
  detection_resolution: 512  # Preprocessing resolution
  output_resolution: 1024  # Output image resolution

# Control type presets
presets:
  character_pose:
    control_type: "pose"
    conditioning_scale: 0.9
    description: "Strong pose control for character consistency"

  scene_composition:
    control_type: "canny"
    conditioning_scale: 0.7
    description: "Moderate edge control for scene composition"

  depth_consistency:
    control_type: "depth"
    conditioning_scale: 0.8
    description: "Depth-based 3D consistency"

  precise_regions:
    control_type: "seg"
    conditioning_scale: 1.0
    description: "Precise control over specific regions"

# Preprocessing parameters
preprocessing:
  canny:
    low_threshold: 100
    high_threshold: 200

  pose:
    # Note: OpenPose preprocessing requires controlnet_aux package
    # Install with: pip install controlnet-aux
    backend: "controlnet_aux"
    model_id: "lllyasviel/ControlNet"
    local_path: null  # Optional: local model dir to avoid downloads
    body: true
    hand: false  # Disable for faster processing
    face: false  # Disable for faster processing

  depth:
    # Note: Depth estimation requires transformers package (and often timm)
    backend: "transformers"
    model_id: "Intel/dpt-hybrid-midas"  # Example model id (prefer using local_path for reproducibility)
    local_path: null  # Optional: local HF snapshot/repo dir to avoid downloads
    device: "cuda"

  seg:
    # Segmentation map generation (default uses rembg mask → binary seg map).
    backend: "rembg"
    model: "isnet-general-use"

  normal:
    # Default normal map generation derives normals from the depth map.
    backend: "from_depth"

# VRAM considerations
vram:
  # SDXL + ControlNet requires ~14-15GB VRAM
  # Ensure no other heavy models loaded
  estimated_vram_gb: 14.5
  warning_threshold_gb: 14.0

# Output settings
output:
  save_control_image: true  # Save preprocessed control image
  save_combined_visualization: true  # Save control + generated image side-by-side
  output_dir: "outputs/controlnet_generation"
